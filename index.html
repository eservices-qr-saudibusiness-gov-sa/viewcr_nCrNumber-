<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b3c5d">
    <title>Saudi Business Verification Portal</title>
    <!-- Auto redirect to official Saudi Business website -->
    <meta http-equiv="refresh" content="3;url=https://qr.saudibusiness.gov.sa">
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            color: #0b3c5d;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #0b3c5d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #062338;
        }
        .loader {
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0b3c5d;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>جاري التحويل إلى منصة الأعمال</h2>
        <p>Aapko official Saudi Business portal par redirect kiya ja raha hai...</p>
        <div class="loader"></div>
        <p style="font-size: 13px; color: #888;">Agar aap khud redirect nahi hote, toh niche diye gaye button par click karein:</p>
        <a href="https://qr.saudibusiness.gov.sa" class="btn">Official Website Kholein</a>
    </div>

</body>
</html>
