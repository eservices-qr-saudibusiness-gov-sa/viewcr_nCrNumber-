<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logisti - تفاصيل بطاقة السائق | VIP</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for official Saudi look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // Custom colors and fonts matching the screenshots
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        logisti: {
                            green: '#006C4C',
                            lightGreen: '#0A8F67',
                            navy: '#12192C',
                            bg: '#FAFCFB',
                            text: '#1F2937',
                            muted: '#6B7280',
                            border: '#E5E7EB',
                            badge: '#E11D48',
                            customTeal: '#009788'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        arabic: ['"IBM Plex Sans Arabic"', 'Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
            background-color: #FAFCFB;
            color: #1F2937;
            -webkit-tap-highlight-color: transparent; /* VIP smoothness */
        }
        
        .dir-ltr {
            direction: ltr !important;
            display: inline-block;
        }

        /* Floating buttons subtle shine glow, perfected for VIP */
        .floating-btn-glow {
            box-shadow: 0 10px 25px -3px rgba(0, 108, 76, 0.25), 0 4px 6px -2px rgba(0, 108, 76, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .floating-btn-glow:hover {
            box-shadow: 0 15px 30px -3px rgba(0, 108, 76, 0.35), 0 6px 8px -2px rgba(0, 108, 76, 0.08);
            transform: translateY(-2px) scale(1.05);
        }

        .floating-navy-glow {
            box-shadow: 0 10px 25px -3px rgba(18, 25, 44, 0.25), 0 4px 6px -2px rgba(18, 25, 44, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .floating-navy-glow:hover {
            box-shadow: 0 15px 30px -3px rgba(18, 25, 44, 0.35), 0 6px 8px -2px rgba(18, 25, 44, 0.08);
            transform: translateY(-2px) scale(1.05);
        }
        
        /* Chat popup animation */
        @keyframes popupSlide {
            from { opacity: 0; transform: translateY(10px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }
        .chat-popup-animate {
            animation: popupSlide 0.4s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-logisti-green selection:text-white relative" id="body-root">

    <!-- 1. HEADER BAR: NOW FUNCTIONAL (VIP SLIM) -->
    <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-logisti-border" dir="ltr">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-12 flex items-center justify-between">
            
            <!-- Left Side: 4 Action Icons (VIP Small Scale) -->
            <div class="flex items-center space-x-2.5 sm:space-x-3">
                <button onclick="alert('الحساب الشخصي')" class="p-1 text-gray-700 hover:text-logisti-green rounded-full transition-colors" title="الحساب">
                    <i class="fa-regular fa-user text-sm"></i>
                </button>
                
                <button onclick="toggleLanguage()" class="p-1 text-gray-700 hover:text-logisti-green rounded-full transition-colors flex items-center gap-0.5" title="تغيير اللغة">
                    <i class="fa-solid fa-language text-base"></i>
                </button>

                <button onclick="toggleSearch()" class="p-1 text-gray-700 hover:text-logisti-green rounded-full transition-colors" title="البحث">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>

                <button onclick="toggleNotifications()" class="p-1 text-gray-700 hover:text-logisti-green rounded-full transition-colors relative" title="التنبيهات">
                    <i class="fa-solid fa-bullhorn text-sm"></i>
                    <!-- Notification Badge (Functional) -->
                    <span class="absolute top-0 right-0 block h-1.5 w-1.5 rounded-full ring-1 ring-white bg-red-600"></span>
                </button>
            </div>

            <!-- Right Side: Logisti Branding & EXACT Shield Logo + Menu Icon -->
            <div class="flex items-center space-x-2.5 sm:space-x-3">
                <a href="https://logisti.sa" target="_blank" class="flex items-center gap-1.5 group" dir="rtl">
                    <div class="flex flex-col text-right font-light">
                        <span class="text-xs tracking-tight text-logisti-green font-arabic leading-none">لوجستي</span>
                        <span class="text-[7px] tracking-widest text-gray-400 uppercase leading-none">LOGISTI</span>
                    </div>
                    <!-- EXACT LOGO as referenced from user images -->
                    <div class="w-6.5 h-6.5 bg-white rounded-md flex items-center justify-center shadow-sm" style="width: 26px; height: 26px;">
                        <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 0 L90 25 V75 L50 100 L10 75 V25 Z" fill="#006C4C"/>
                            <path d="M50 0 L10 25 V75 L50 100 Z" fill="#12192C" opacity="0.1"/>
                            <path d="M50 15 L80 35 V65 L50 85 L20 65 V35 Z" fill="#009788"/>
                            <path d="M50 15 L20 35 V65 L50 85 Z" fill="#000000" opacity="0.1"/>
                            <path d="M50 30 L65 70 L50 60 L35 70 Z" fill="#FFFFFF"/>
                            <path d="M50 30 L35 70 L50 60 Z" fill="#000000" opacity="0.05"/>
                        </svg>
                    </div>
                </a>

                <button onclick="toggleDrawer()" class="p-1 text-gray-700 hover:text-logisti-green rounded-lg focus:outline-none" id="hamburger-btn" title="القائمة">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- SEARCH PANEL (FUNCTIONAL) -->
    <div id="search-panel" class="hidden bg-white border-b border-logisti-border p-4 shadow-inner font-arabic">
        <div class="max-w-xl mx-auto flex gap-2">
            <input type="text" placeholder="ابحث عن الخدمات اللوجستية..." class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-1 focus:ring-logisti-green focus:border-logisti-green text-sm">
            <button class="bg-logisti-green text-white px-5 py-2 rounded-xl font-bold text-sm hover:bg-logisti-darkGreen transition-colors">بحث</button>
        </div>
    </div>

    <!-- MAIN CONTENT SPACE (as per screenshot context, currently empty but formatted) -->
    <main id="main-content-area" class="max-w-md mx-auto w-full px-4 pt-10 pb-12 flex-grow font-arabic flex flex-col items-center">
        <!-- Main page content would go here -->
    </main>

    <!-- 6. EXTENDED FOOTER MENU & DIRECTORIES (FUNCTIONAL) -->
    <div class="w-full max-w-sm space-y-6 text-right font-arabic px-4 mx-auto pb-6">
        
        <!-- About Logisti Section -->
        <div class="border-t border-gray-100 pt-4 space-y-3">
            <h3 class="font-bold text-base text-[#1F2937]">عن لوجستي</h3>
            <div class="space-y-2.5 text-sm font-normal text-[#4B5563]">
                <a href="https://logisti.sa/about" target="_blank" class="block hover:text-logisti-green">نبذة عامة</a>
                <a href="https://logisti.sa/guide" target="_blank" class="block hover:text-logisti-green">الدليل الإرشادي للخدمات</a>
                <a href="https://logisti.sa/news" target="_blank" class="block hover:text-logisti-green">الأخبار والفعاليات</a>
            </div>
        </div>

        <!-- Social Media Icons Section: SIX PERFECTED ICONS -->
        <div class="border-t border-gray-100 pt-4 space-y-3">
            <h3 class="font-bold text-base text-[#1F2937]">تابعنا</h3>
            <div class="flex items-center justify-end flex-wrap gap-2.5 pt-1 dir-ltr">
                <!-- 6 icons, all functional and clear -->
                <a href="https://youtube.com" target="_blank" class="w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-red-600 hover:text-white transition-all" title="يوتيوب">
                    <i class="fa-brands fa-youtube text-lg"></i>
                </a>
                <a href="https://facebook.com" target="_blank" class="w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-[#1877F2] hover:text-white transition-all" title="فيسبوك">
                    <i class="fa-brands fa-facebook-f text-lg"></i>
                </a>
                <a href="https://instagram.com" target="_blank" class="w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-logisti-green hover:text-white transition-all" title="انستغرام">
                    <i class="fa-brands fa-instagram text-lg"></i>
                </a>
                <a href="https://linkedin.com" target="_blank" class="w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-logisti-green hover:text-white transition-all" title="لينكيد إن">
                    <i class="fa-brands fa-linkedin-in text-lg"></i>
                </a>
                <a href="https://twitter.com" target="_blank" class="w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-black hover:text-white transition-all" title="تويتر">
                    <i class="fa-brands fa-x-twitter text-lg"></i>
                </a>
                <a href="https://snapchat.com" target="_blank" class="w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-[#FFFC00] hover:text-black transition-all" title="سناب شات">
                    <i class="fa-brands fa-snapchat text-lg"></i>
                </a>
            </div>
        </div>

        <!-- Accessibility Tools Section (Functional) -->
        <div class="border-t border-gray-100 pt-4 space-y-3">
            <h3 class="font-bold text-base text-[#1F2937]">أدوات الاتاحة والوصول</h3>
            <div class="flex items-center justify-end gap-3 pt-1">
                <button onclick="adjustFontSize(1)" class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-100" title="تكبير الخط">
                    <i class="fa-solid fa-magnifying-glass-plus text-lg"></i>
                </button>
                <button onclick="toggleHighContrast()" class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-100" title="خيارات أخرى">
                    <i class="fa-solid fa-eye text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Rights & Elm Company -->
        <div class="pt-10 space-y-1 text-center border-t border-gray-100">
            <p class="text-sm font-bold text-[#1F2937]">جميع الحقوق محفوظة 2022 - 2026 © لمنصة لوجستي</p>
            <p class="text-xs text-[#6B7280]">من تطوير وصيانة شركة علم</p>
        </div>

        <!-- FOOTER LOGO: EXACT MATCH -->
        <div class="flex justify-center items-center pt-3 pb-6">
            <a href="https://logisti.sa" target="_blank" class="flex items-center gap-2">
                <div class="flex flex-col text-right font-light">
                    <span class="text-xs tracking-tight text-logisti-green font-arabic leading-none">لوجستي</span>
                    <span class="text-[8px] tracking-widest text-gray-400 uppercase leading-none">LOGISTI</span>
                </div>
                <!-- EXACT LOGO from referenced images -->
                <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center shadow-sm">
                    <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 0 L90 25 V75 L50 100 L10 75 V25 Z" fill="#006C4C"/>
                        <path d="M50 0 L10 25 V75 L50 100 Z" fill="#12192C" opacity="0.1"/>
                        <path d="M50 15 L80 35 V65 L50 85 L20 65 V35 Z" fill="#009788"/>
                        <path d="M50 15 L20 35 V65 L50 85 Z" fill="#000000" opacity="0.1"/>
                        <path d="M50 30 L65 70 L50 60 L35 70 Z" fill="#FFFFFF"/>
                        <path d="M50 30 L35 70 L50 60 Z" fill="#000000" opacity="0.05"/>
                    </svg>
                </div>
            </a>
        </div>

    </div>

    <!-- CHAT ASSISTANT POPUP (ADDED FUNCTIONAL 'X' / CARTIS MARK) -->
    <div id="chat-popup" class="fixed bottom-20 left-1/2 z-50 chat-popup-animate hidden" style="transform: translateX(-50%); width: 220px;">
        <div class="bg-white p-3 rounded-2xl shadow-xl border border-gray-100 text-right font-arabic relative">
            <!-- X / CARTIS MARK - CLOSES THE POPUP -->
            <button onclick="closeChatPopup()" class="absolute top-2 left-2 text-gray-400 hover:text-gray-700 p-1" title="إغلاق">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
            <p class="text-[11px] font-semibold text-[#6B7280]">بلغ متوسط تقييم هذه الخدمة</p>
            <p class="text-lg font-bold text-[#1F2937] pt-0.5">4.26</p>
            <div class="flex items-center gap-1.5 justify-end text-sm text-[#006C4C] pt-1">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star-half-stroke"></i>
                <span class="text-[10px] font-semibold text-[#6B7280]">(113 تقييم)</span>
            </div>
            <p class="text-[11px] font-semibold text-logisti-navy pt-2 leading-tight">مرحبا! أنا هنا لمساعدتك في أي استفسار.</p>
        </div>
    </div>

    <!-- 7. FLOATING ACTION BUTTONS -->
    <div class="fixed bottom-4 left-4 z-50 flex items-center gap-3 dir-ltr">
        <!-- Live Support / Headset Button (Dark Navy) -->
        <button onclick="toggleChatPopup()" class="w-12 h-12 bg-logisti-navy text-white rounded-full flex items-center justify-center floating-navy-glow cursor-pointer" title="الدعم الفني والواتساب">
            <i class="fa-solid fa-headset text-xl"></i>
        </button>

        <!-- Accessibility Button (Green) -->
        <button onclick="alert('أدوات إمكانية الوصول')" class="w-12 h-12 bg-[#0A8F67] text-white rounded-full flex items-center justify-center floating-btn-glow cursor-pointer" title="إمكانية الوصول">
            <i class="fa-solid fa-universal-access text-2xl"></i>
        </button>
    </div>

    <!-- JAVASCRIPT LOGIC FOR FUNCTIONALITY -->
    <script>
        function toggleGovDropdown() {
            // Oficial banner dropdown logic (if implemented)
        }

        function toggleDrawer() {
            alert('فتح القائمة'); // Hamburger menu action
        }

        function toggleLanguage() {
            alert('تغيير اللغة (Language Switch)'); // Language switch action
        }

        // Functional Search Panel
        function toggleSearch() {
            const panel = document.getElementById('search-panel');
            panel.classList.toggle('hidden');
        }

        function toggleNotifications() {
            alert('فتح التنبيهات (Notifications)'); // Notifications action
        }

        // Functional Chat Popup
        function toggleChatPopup() {
            const popup = document.getElementById('chat-popup');
            popup.classList.toggle('hidden');
        }

        // Closable Chat Popup (Cartis / X functionality)
        function closeChatPopup() {
            const popup = document.getElementById('chat-popup');
            popup.classList.add('hidden'); // Fully closes the popup
        }

        function voteHelpful(status) {
            // Helpful voting logic (if implemented)
        }

        function adjustFontSize(direction) {
            alert(direction > 0 ? 'تكبير الخط' : 'تصغير الخط'); // Font sizing action
        }

        function toggleHighContrast() {
            alert('تفعيل التباين العالي'); // High contrast action
        }
    </script>
</body>
</html>
